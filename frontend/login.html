<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - AgriDSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h4 class="fw-bold">AgriDSS</h4>
                            <p class="text-muted">Sistem Pendukung Keputusan Pertanian</p>
                        </div>
                        
                        <form id="formLogin">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username</label>
                                <input type="text" id="inputUsername" class="form-control" placeholder="Masukkan username" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" id="inputPassword" class="form-control" placeholder="Masukkan sandi" required>
                            </div>
                            <button type="submit" id="btnLogin" class="btn btn-success w-100 py-2">Masuk ke Sistem</button>
                        </form>
                        
                        <div id="pesanError" class="alert alert-danger mt-3 d-none text-center" role="alert" style="font-size: 14px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah form memuat ulang halaman
            
            const btn = document.getElementById('btnLogin');
            const pesanError = document.getElementById('pesanError');
            
            // Ubah tombol jadi loading
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Memeriksa...';
            btn.disabled = true;
            pesanError.classList.add('d-none'); // Sembunyikan error lama

            // PENTING: FastAPI OAuth2 meminta format 'x-www-form-urlencoded', bukan JSON!
            const params = new URLSearchParams();
            params.append('username', document.getElementById('inputUsername').value);
            params.append('password', document.getElementById('inputPassword').value);

            fetch('http://127.0.0.1:8000/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: params
            })
            .then(response => {
                if (!response.ok) throw new Error('Username atau password salah!');
                return response.json();
            })
            .then(data => {
                // SIMPAN TOKEN KE DALAM MEMORI BROWSER
                localStorage.setItem('agridss_token', data.access_token);
                
                // Lempar pengguna ke halaman Dashboard/Lahan
                window.location.href = 'lahan.html';
            })
            .catch(err => {
                // Jika gagal, tampilkan pesan merah dan normalkan tombol
                pesanError.textContent = err.message;
                pesanError.classList.remove('d-none');
                btn.innerHTML = 'Masuk ke Sistem';
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
